<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6b7b"/>
    </marker>
    <style>
      .ltitle { font-size: 12.5px; font-weight: 700; fill: #33475b; }
      .btext { font-size: 12px; fill: #1f2d3d; }
      .note { font-size: 10.5px; fill: #6b7b8b; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="30" y="28" font-size="18" font-weight="700" fill="#1f2d3d">RobustMQ AMQP &#183; Architecture</text>
  <text x="30" y="46" class="note">One data, multiple protocol views (AMQP joins Kafka + MQTT on the same kernel)</text>

  <!-- Client -->
  <rect x="30" y="60" width="840" height="52" rx="9" fill="#eef4fb" stroke="#cfe0f2"/>
  <text x="44" y="78" class="ltitle">Client</text>
  <rect x="120" y="68" width="200" height="36" rx="7" fill="#ffffff" stroke="#4a90d9"/>
  <text x="220" y="91" text-anchor="middle" class="btext">Any AMQP 0-9-1 client</text>
  <rect x="336" y="68" width="140" height="36" rx="7" fill="#ffffff" stroke="#4a90d9"/>
  <text x="406" y="91" text-anchor="middle" class="btext">lapin (Rust)</text>
  <rect x="492" y="68" width="140" height="36" rx="7" fill="#ffffff" stroke="#4a90d9"/>
  <text x="562" y="91" text-anchor="middle" class="btext">pika (Python)</text>
  <rect x="648" y="68" width="180" height="36" rx="7" fill="#ffffff" stroke="#4a90d9"/>
  <text x="738" y="91" text-anchor="middle" class="btext">RabbitMQ client libs</text>

  <!-- Protocol -->
  <rect x="30" y="126" width="840" height="60" rx="9" fill="#f3f0fb" stroke="#ddd3f2"/>
  <text x="44" y="144" class="ltitle">Protocol &#183; src/protocol</text>
  <rect x="140" y="150" width="170" height="28" rx="7" fill="#ffffff" stroke="#8e6fce"/>
  <text x="225" y="169" text-anchor="middle" class="btext">Frame codec</text>
  <rect x="326" y="150" width="240" height="28" rx="7" fill="#ffffff" stroke="#8e6fce"/>
  <text x="446" y="169" text-anchor="middle" class="btext">Method dispatch (Connection/Channel/...)</text>
  <rect x="582" y="150" width="180" height="28" rx="7" fill="#ffffff" stroke="#8e6fce"/>
  <text x="672" y="169" text-anchor="middle" class="btext">Network (ordered)</text>

  <!-- Core -->
  <rect x="30" y="200" width="840" height="100" rx="9" fill="#eef7f0" stroke="#cfe9d6"/>
  <text x="44" y="218" class="ltitle">Core &#183; src/amqp-broker</text>
  <rect x="60" y="228" width="150" height="30" rx="7" fill="#ffffff" stroke="#3aa564"/>
  <text x="135" y="248" text-anchor="middle" class="btext">Exchange / Queue</text>
  <rect x="220" y="228" width="180" height="30" rx="7" fill="#ffffff" stroke="#3aa564"/>
  <text x="310" y="248" text-anchor="middle" class="btext">Routing (direct/fanout/topic/headers)</text>
  <rect x="410" y="228" width="150" height="30" rx="7" fill="#ffffff" stroke="#3aa564"/>
  <text x="485" y="248" text-anchor="middle" class="btext">Basic.Get + cursor</text>
  <rect x="570" y="228" width="150" height="30" rx="7" fill="#ffffff" stroke="#3aa564"/>
  <text x="645" y="248" text-anchor="middle" class="btext">Ack / Nack / Reject</text>
  <rect x="730" y="228" width="110" height="30" rx="7" fill="#ffffff" stroke="#3aa564"/>
  <text x="785" y="248" text-anchor="middle" class="btext">Requeue</text>
  <rect x="60" y="264" width="150" height="30" rx="7" fill="#ffffff" stroke="#3aa564"/>
  <text x="135" y="284" text-anchor="middle" class="btext">SASL PLAIN auth</text>
  <rect x="220" y="264" width="150" height="30" rx="7" fill="#ffffff" stroke="#3aa564"/>
  <text x="295" y="284" text-anchor="middle" class="btext">Unacked index</text>
  <rect x="380" y="264" width="180" height="30" rx="7" fill="#ffffff" stroke="#3aa564"/>
  <text x="470" y="284" text-anchor="middle" class="btext">Recovery scanner (leader-pinned)</text>
  <rect x="570" y="264" width="130" height="30" rx="7" fill="#ffffff" stroke="#3aa564"/>
  <text x="635" y="284" text-anchor="middle" class="btext">Basic.Consume</text>
  <text x="710" y="284" font-size="10.5" fill="#b25b5b">&#9711; being rebuilt</text>

  <!-- Storage -->
  <rect x="30" y="314" width="520" height="86" rx="9" fill="#fbf4ec" stroke="#f2e2cf"/>
  <text x="44" y="332" class="ltitle">Storage &#183; storage-adapter</text>
  <rect x="56" y="344" width="150" height="46" rx="7" fill="#ffffff" stroke="#d9862a"/>
  <text x="131" y="371" text-anchor="middle" class="btext">Queue shard (1 partition)</text>
  <rect x="216" y="344" width="150" height="46" rx="7" fill="#ffffff" stroke="#d9862a"/>
  <text x="291" y="371" text-anchor="middle" class="btext">$amqp-unacked-index</text>
  <rect x="376" y="344" width="150" height="46" rx="7" fill="#ffffff" stroke="#d9862a"/>
  <text x="451" y="371" text-anchor="middle" class="btext">Delete by offset</text>

  <!-- Meta -->
  <rect x="570" y="314" width="300" height="86" rx="9" fill="#fdeef0" stroke="#f7d6dc"/>
  <text x="584" y="332" class="ltitle">Metadata &#183; Raft</text>
  <rect x="586" y="342" width="268" height="24" rx="6" fill="#ffffff" stroke="#d24b63"/>
  <text x="720" y="358" text-anchor="middle" class="btext">Delivery cursor: conditional commit</text>
  <rect x="586" y="370" width="268" height="24" rx="6" fill="#ffffff" stroke="#d24b63"/>
  <text x="720" y="386" text-anchor="middle" class="btext">Cluster status (leader for scanner)</text>

  <!-- connectors -->
  <line x1="450" y1="112" x2="450" y2="126" stroke="#5b6b7b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="450" y1="186" x2="450" y2="200" stroke="#5b6b7b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="290" y1="300" x2="290" y2="314" stroke="#5b6b7b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="720" y1="300" x2="720" y2="314" stroke="#5b6b7b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="30" y="426" class="note">Basic.Get reads the shared cursor, conditionally commits it via Raft, indexes the delivery before commit.</text>
  <text x="30" y="444" class="note">Same shard, same metadata layer Kafka and MQTT already use &#8212; AMQP just adds its own view on top.</text>
</svg>
