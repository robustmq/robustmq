<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .ltitle { font-size: 13px; font-weight: 700; fill: #33475b; }
      .btext { font-size: 11.5px; fill: #1f2d3d; }
      .note { font-size: 10.5px; fill: #6b7b8b; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <text x="30" y="28" font-size="18" font-weight="700" fill="#1f2d3d">RobustMQ AMQP &#183; Roadmap</text>
  <text x="30" y="46" class="note">Get/Ack path landed; Consume push is what's left before the main body is complete</text>

  <!-- Done -->
  <rect x="30" y="66" width="400" height="330" rx="9" fill="#eef7f0" stroke="#cfe9d6"/>
  <text x="46" y="88" class="ltitle">Done</text>
  <text x="46" y="116" class="btext">&#10003; Exchange / Queue declare, delete, bind, unbind, purge</text>
  <text x="46" y="140" class="btext">&#10003; Routing: direct / fanout / topic / headers</text>
  <text x="46" y="164" class="btext">&#10003; Exchange-to-exchange binding chains</text>
  <text x="46" y="188" class="btext">&#10003; Basic.Publish, property passthrough</text>
  <text x="46" y="212" class="btext">&#10003; Basic.Get: shared cursor, no lock, CAS retry</text>
  <text x="46" y="236" class="btext">&#10003; delivery_tag, unacked registry + durable index</text>
  <text x="46" y="260" class="btext">&#10003; Ack / Nack / Reject / Recover, one settle path</text>
  <text x="46" y="284" class="btext">&#10003; requeue_message, shared by 5 callers</text>
  <text x="46" y="308" class="btext">&#10003; Graceful close requeues in-flight messages</text>
  <text x="46" y="332" class="btext">&#10003; Crash recovery scanner, single leader-pinned</text>
  <text x="46" y="356" class="note">SASL PLAIN auth, per-vhost tenant mapping also in place.</text>

  <!-- In progress / planned -->
  <rect x="470" y="66" width="400" height="330" rx="9" fill="#fbf4ec" stroke="#f2e2cf"/>
  <text x="486" y="88" class="ltitle">In progress / Planned</text>
  <text x="486" y="116" class="btext">&#9711; Basic.Consume on the shared cursor + ack path</text>
  <text x="486" y="140" class="btext">&#9711; Basic.Cancel actually stopping delivery</text>
  <text x="486" y="164" class="btext">&#9711; QoS / prefetch (Basic.Qos is ack-only today)</text>
  <text x="486" y="188" class="btext">&#9711; Real transactions (Tx class is a no-op ack)</text>
  <text x="486" y="212" class="btext">&#9711; Non-durable queues actually dropped on restart</text>
  <text x="486" y="236" class="btext">&#9711; Integration tests beyond Basic.Get</text>
  <text x="486" y="356" class="note">This is a first pass to prove the flow, not a hardened path yet.</text>
</svg>
