# RobustMQ MQTT Broker Alerting Rules
# This file contains Prometheus alerting rules for RobustMQ monitoring

groups:
  - name: robustmq.mqtt.broker
    rules:
      # High connection count
      - alert: RobustMQHighConnectionCount
        expr: mqtt_connections_count > 5000
        for: 5m
        labels:
          severity: warning
          service: robustmq-mqtt-broker
        annotations:
          summary: "RobustMQ MQTT Broker has high connection count"
          description: "MQTT Broker has {{ $value }} active connections, which is above the threshold of 5000."

      # Connection failure rate
      - alert: RobustMQHighConnectionFailureRate
        expr: (sum(rate(mqtt_connection_failed_total[5m])) / clamp_min(sum(rate(mqtt_connection_success_total[5m])) + sum(rate(mqtt_connection_failed_total[5m])), 1e-9)) > 0.1
        for: 2m
        labels:
          severity: warning
          service: robustmq-mqtt-broker
        annotations:
          summary: "RobustMQ MQTT Broker has a high connection failure rate"
          description: "MQTT connection failure rate is {{ $value | humanizePercentage }}."

      # High request latency
      - alert: RobustMQHighRequestLatency
        expr: histogram_quantile(0.95, sum by (le, network) (rate(handler_total_ms_bucket[5m]))) > 100
        for: 10m
        labels:
          severity: warning
          service: robustmq-mqtt-broker
        annotations:
          summary: "RobustMQ MQTT Broker high request latency"
          description: "P95 request latency is {{ $value }}ms on {{ $labels.network }}."

      # Critical request latency
      - alert: RobustMQCriticalRequestLatency
        expr: histogram_quantile(0.95, sum by (le, network) (rate(handler_total_ms_bucket[5m]))) > 500
        for: 5m
        labels:
          severity: critical
          service: robustmq-mqtt-broker
        annotations:
          summary: "RobustMQ MQTT Broker has critical request latency"
          description: "P95 request latency is {{ $value }}ms on {{ $labels.network }}."

      # MQTT protocol packet processing latency
      - alert: RobustMQHighMqttPacketProcessingLatency
        expr: histogram_quantile(0.95, sum by (le, network, packet) (rate(mqtt_packet_process_duration_ms_bucket[5m]))) > 100
        for: 3m
        labels:
          severity: warning
          service: robustmq-mqtt-broker
        annotations:
          summary: "RobustMQ MQTT Broker has high packet processing latency"
          description: "P95 processing latency is {{ $value }}ms for {{ $labels.packet }} on {{ $labels.network }}."

      # Authentication failures
      - alert: RobustMQAuthenticationFailures
        expr: sum by (network) (rate(mqtt_packets_connack_auth_error_total[5m])) > 10
        for: 2m
        labels:
          severity: critical
          service: robustmq-mqtt-broker
        annotations:
          summary: "RobustMQ MQTT Broker authentication failures"
          description: "High authentication failure rate: {{ $value }} failures/sec on {{ $labels.network }}."

      # MQTT authentication failure ratio
      - alert: RobustMQHighMqttAuthenticationFailureRatio
        expr: (sum(rate(mqtt_auth_failed_total[5m])) / clamp_min(sum(rate(mqtt_auth_success_total[5m])) + sum(rate(mqtt_auth_failed_total[5m])), 1e-9)) > 0.2
        for: 1m
        labels:
          severity: warning
          service: robustmq-mqtt-broker
        annotations:
          summary: "RobustMQ MQTT Broker has a high authentication failure ratio"
          description: "MQTT authentication failure ratio is {{ $value | humanizePercentage }}."

      # Connection errors
      - alert: RobustMQConnectionErrors
        expr: sum by (network) (rate(mqtt_packets_connack_error_total[5m])) > 5
        for: 5m
        labels:
          severity: warning
          service: robustmq-mqtt-broker
        annotations:
          summary: "RobustMQ MQTT Broker connection errors"
          description: "High connection error rate: {{ $value }} errors/sec on {{ $labels.network }}."

      # High packet error rate
      - alert: RobustMQPacketErrors
        expr: sum by (network) (rate(mqtt_packets_received_error_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: robustmq-mqtt-broker
        annotations:
          summary: "RobustMQ MQTT Broker packet errors"
          description: "High packet error rate: {{ $value }} errors/sec on {{ $labels.network }}."

      # High queue depth
      - alert: RobustMQHighQueueDepth
        expr: handler_queue_size{label="handler"} > 1000
        for: 5m
        labels:
          severity: warning
          service: robustmq-mqtt-broker
        annotations:
          summary: "RobustMQ MQTT Broker high queue depth"
          description: "Handler queue depth is {{ $value }}."

      # Critical queue depth
      - alert: RobustMQCriticalQueueDepth
        expr: handler_queue_size{label="handler"} > 5000
        for: 2m
        labels:
          severity: critical
          service: robustmq-mqtt-broker
        annotations:
          summary: "RobustMQ MQTT Broker critical queue depth"
          description: "Handler queue depth is {{ $value }}."

      # High message drop rate
      - alert: RobustMQHighMessageDrops
        expr: rate(mqtt_messages_dropped_no_subscribers_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
          service: robustmq-mqtt-broker
        annotations:
          summary: "RobustMQ MQTT Broker high message drop rate"
          description: "High message drop rate due to no subscribers: {{ $value }} drops/sec."

      # Connector messages discarded by a terminal strategy
      - alert: RobustMQHighConnectorDiscardRate
        expr: sum by (tenant, connector_type, connector_name, strategy) (rate(mqtt_connector_messages_discarded_total[5m])) > 50
        for: 5m
        labels:
          severity: warning
          service: robustmq-mqtt-broker
        annotations:
          summary: "RobustMQ MQTT Connector has a high discard rate"
          description: "Connector {{ $labels.connector_name }} ({{ $labels.connector_type }}, tenant {{ $labels.tenant }}) discards {{ $value }} messages/sec using strategy {{ $labels.strategy }}."

      # Low throughput (might indicate issues)
      - alert: RobustMQLowThroughput
        expr: sum(rate(mqtt_packets_received_total[10m])) < 1
        for: 15m
        labels:
          severity: info
          service: robustmq-mqtt-broker
        annotations:
          summary: "RobustMQ MQTT Broker low throughput"
          description: "Very low MQTT packet throughput: {{ $value }} packets/sec."

      # Delay queue capacity
      - alert: RobustMQDelayQueueNearFull
        expr: (mqtt_delay_queue_total_capacity > 0) and ((mqtt_delay_queue_used_capacity / mqtt_delay_queue_total_capacity) > 0.9)
        for: 2m
        labels:
          severity: critical
          service: robustmq-mqtt-broker
        annotations:
          summary: "RobustMQ MQTT delay queue is near capacity"
          description: "Shard {{ $labels.shard_no }} is using {{ $value | humanizePercentage }} of its delay queue capacity."

      # Retained-message capacity
      - alert: RobustMQTooManyRetainedMessages
        expr: mqtt_retained_count > 100000
        for: 5m
        labels:
          severity: warning
          service: robustmq-mqtt-broker
        annotations:
          summary: "RobustMQ MQTT Broker has many retained messages"
          description: "Current retained message count is {{ $value }}."

      # Broker down
      - alert: RobustMQBrokerDown
        expr: up{job="robustmq-mqtt-broker"} == 0
        for: 1m
        labels:
          severity: critical
          service: robustmq-mqtt-broker
        annotations:
          summary: "RobustMQ MQTT Broker is down"
          description: "RobustMQ MQTT Broker instance {{ $labels.instance }} is down."

  - name: robustmq.mqtt.broker.capacity
    rules:
      # High thread utilization
      - alert: RobustMQHighThreadUtilization
        expr: broker_active_thread_num > 50
        for: 10m
        labels:
          severity: warning
          service: robustmq-mqtt-broker
        annotations:
          summary: "RobustMQ MQTT Broker high thread utilization"
          description: "High thread count: {{ $value }} active threads for {{ $labels.network }} {{ $labels.thread_type }}."

  - name: robustmq.mqtt.broker.performance
    rules:
      # Recording rules for better query performance
      - record: robustmq:request_latency_95th
        expr: histogram_quantile(0.95, sum by (le, network) (rate(handler_total_ms_bucket[5m])))

      - record: robustmq:request_latency_50th
        expr: histogram_quantile(0.50, sum by (le, network) (rate(handler_total_ms_bucket[5m])))

      - record: robustmq:packet_rate_received
        expr: sum by (network) (rate(mqtt_packets_received_total[5m]))

      - record: robustmq:packet_rate_sent
        expr: sum by (network, qos) (rate(mqtt_packets_sent_total[5m]))

      - record: robustmq:byte_rate_received
        expr: sum by (network) (rate(mqtt_bytes_received_total[5m]))

      - record: robustmq:byte_rate_sent
        expr: sum by (network, qos) (rate(mqtt_bytes_sent_total[5m]))

      - record: robustmq:error_rate_total
        expr: sum by (network) (rate(mqtt_packets_received_error_total[5m]) + rate(mqtt_packets_connack_auth_error_total[5m]) + rate(mqtt_packets_connack_error_total[5m]))

      # SLI/SLO metrics
      - record: robustmq:sli_availability
        expr: up{job="robustmq-mqtt-broker"}

      - record: robustmq:sli_latency_good
        expr: (sum by (network) (rate(handler_total_ms_bucket{le="100"}[5m])) / sum by (network) (rate(handler_total_ms_count[5m]))) * 100

      - record: robustmq:sli_error_rate
        expr: (sum by (network) (rate(mqtt_packets_received_error_total[5m])) / sum by (network) (rate(mqtt_packets_received_total[5m]))) * 100
