[package]
name = "cmd"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "cli-command"

[[bin]]
name = "broker-server"
path = "src/broker-server/server.rs"

[[bin]]
name = "cli-command"
path = "src/cli-command/command.rs"

[[bin]]
name = "cli-bench"
path = "src/cli-bench/bench.rs"

[dependencies]
clap.workspace = true
common-base.workspace = true
common-config.workspace = true
tokio.workspace = true
rustls.workspace = true
cli-command.workspace = true
cli-bench.workspace = true
broker-server.workspace = true

[features]
# mq9 agent semantic/full-text search (lancedb + fastembed/ort). Off by
# default: heavy (large binary, no musl-compatible ONNX Runtime binaries) and
# only used by this one feature. Enable for a build that needs mq9 agent
# search, e.g. `cargo build --features vector-search`.
vector-search = ["broker-server/vector-search"]

[dev-dependencies]
mockall.workspace = true

# Not used directly; pulls in the vendored-OpenSSL feature for every binary
# built from this crate (see the comment on [workspace.dependencies].openssl).
# Windows is excluded: its openssl-sys build there uses a pre-installed OpenSSL
# via OPENSSL_DIR/OPENSSL_STATIC (see release.yml), not a from-source vendored
# build -- the CI runner's perl is missing CPAN modules openssl-src's
# Configure script needs, so forcing vendored there fails the build.
[target.'cfg(not(windows))'.dependencies]
openssl.workspace = true
