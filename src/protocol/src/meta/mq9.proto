syntax = "proto3";
package meta.service.mq9;

import "meta/validate.proto";

service Mq9Service {
  rpc CreateMail(CreateMailRequest) returns (CreateMailReply) {}
  rpc DeleteMail(DeleteMailRequest) returns (DeleteMailReply) {}
  rpc ListMail(ListMailRequest) returns (stream ListMailReply) {}

  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentReply) {}
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentReply) {}
  rpc ListAgent(ListAgentRequest) returns (stream ListAgentReply) {}
  rpc SearchAgent(SearchAgentRequest) returns (SearchAgentReply) {}

  rpc CreateForwardRule(CreateForwardRuleRequest) returns (CreateForwardRuleReply) {}
  rpc UpdateForwardRule(UpdateForwardRuleRequest) returns (UpdateForwardRuleReply) {}
  rpc DeleteForwardRule(DeleteForwardRuleRequest) returns (DeleteForwardRuleReply) {}
  rpc ListForwardRule(ListForwardRuleRequest) returns (stream ListForwardRuleReply) {}
}

message CreateMailRequest {
  string tenant = 1 [(validate.rules).string.min_len = 1];
  bytes content = 2 [(validate.rules).bytes.min_len = 1];
}

message CreateMailReply {}

message DeleteMailRequest {
  string tenant = 1 [(validate.rules).string.min_len = 1];
  string mail_address = 2 [(validate.rules).string.min_len = 1];
}

message DeleteMailReply {}

message ListMailRequest {
  string tenant = 1;
}

message ListMailReply {
  bytes mail = 1;
}

message CreateAgentRequest {
  string tenant = 1 [(validate.rules).string.min_len = 1];
  bytes content = 2 [(validate.rules).bytes.min_len = 1];
}

message CreateAgentReply {}

message DeleteAgentRequest {
  string tenant = 1 [(validate.rules).string.min_len = 1];
  string name = 2 [(validate.rules).string.min_len = 1];
}

message DeleteAgentReply {}

message ListAgentRequest {
  string tenant = 1;
}

message ListAgentReply {
  bytes agent = 1;
}

message SearchAgentRequest {
  string tenant = 1;
  string text = 2;
  string semantic = 3;
  uint32 limit = 4;
  uint32 offset = 5;
}

message AgentSearchItem {
  string agent_id = 1;
  string name = 2;
  string description = 3;
  string agent_info = 4;
}

message SearchAgentReply {
  repeated AgentSearchItem items = 1;
}

message CreateForwardRuleRequest {
  string tenant = 1 [(validate.rules).string.min_len = 1];
  string rule_name = 2 [(validate.rules).string.min_len = 1];
  bytes content = 3 [(validate.rules).bytes.min_len = 1];
}

message CreateForwardRuleReply {}

message UpdateForwardRuleRequest {
  string tenant = 1 [(validate.rules).string.min_len = 1];
  string rule_name = 2 [(validate.rules).string.min_len = 1];
  bytes content = 3 [(validate.rules).bytes.min_len = 1];
}

message UpdateForwardRuleReply {}

message DeleteForwardRuleRequest {
  string tenant = 1 [(validate.rules).string.min_len = 1];
  string rule_name = 2 [(validate.rules).string.min_len = 1];
}

message DeleteForwardRuleReply {}

message ListForwardRuleRequest {
  string tenant = 1;
  string rule_name = 2;
}

message ListForwardRuleReply {
  bytes rule = 1;
}
