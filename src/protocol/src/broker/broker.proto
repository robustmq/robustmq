syntax = "proto3";
package broker;

service BrokerService {
  rpc UpdateCache(UpdateCacheRequest) returns (UpdateCacheReply) {}
  rpc SendLastWillMessage(SendLastWillMessageRequest) returns (SendLastWillMessageReply) {}
  rpc GetQosDataByClientId(GetQosDataByClientIdRequest) returns (GetQosDataByClientIdReply) {}
  rpc GetShardSegmentDeleteStatus(GetShardSegmentDeleteStatusRequest) returns (GetShardSegmentDeleteStatusReply) {}
  rpc SendShareGroupMessage(SendShareGroupMessageRequest) returns (SendShareGroupMessageReply) {}
  rpc QueryReplicaLeo(QueryReplicaLeoRequest) returns (QueryReplicaLeoReply) {}
  rpc FetchAmqpQueueMessage(FetchAmqpQueueMessageRequest) returns (FetchAmqpQueueMessageReply) {}
}

message UpdateCacheRequest {
  repeated UpdateCacheRecord records = 1;
}

message UpdateCacheRecord {
  BrokerUpdateCacheActionType action_type = 2;
  BrokerUpdateCacheResourceType resource_type = 3;
  bytes data = 4;
}

message UpdateCacheReply {
  bool code = 1;
  string data = 2;
}

message SendLastWillMessageReply {}

message LastWillClientItem {
  string tenant = 1;
  string client_id = 2;
}

message SendLastWillMessageRequest {
  repeated LastWillClientItem items = 1;
}

message GetQosDataByClientIdRequest {
  repeated string client_ids = 1;
}

message GetQosDataByClientIdReply {
  repeated GetQosDataByClientIdRaw data = 1;
}

message GetQosDataByClientIdRaw {
  string client_id = 1;
  bytes qos_data = 2;
}

message ShardSegmentStatusItem {
  string shard_name = 1;
  optional uint32 segment_seq = 2;
}

message GetShardSegmentDeleteStatusRequest {
  repeated ShardSegmentStatusItem items = 1;
}

message ShardSegmentDeleteStatus {
  string shard_name = 1;
  bool deleted = 2;
}

message GetShardSegmentDeleteStatusReply {
  repeated ShardSegmentDeleteStatus results = 1;
}

// Delivers one already-fetched message to a local connection on behalf of
// the shared group's leader (NATS queue group or AMQP queue).
message SendShareGroupMessageRequest {
  uint64 connect_id = 1;
  bytes record = 2;
  oneof detail {
    NatsShareGroupDetail nats = 3;
    AmqpShareGroupDetail amqp = 4;
  }
}

message NatsShareGroupDetail {
  string sid = 1;
}

message AmqpShareGroupDetail {
  uint32 channel_id = 1;
  string consumer_tag = 2;
  string tenant = 3;
  string queue = 4;
  uint64 offset = 5;
  optional uint64 index_offset = 6; // set unless the consumer is no_ack
}

message SendShareGroupMessageReply {}

// A non-leader node forwards a Basic.Get pull to the queue's leader.
message FetchAmqpQueueMessageRequest {
  string tenant = 1;
  string queue = 2;
  string shard_name = 3;
  uint64 connect_id = 4;
  uint32 channel_id = 5;
  bool no_ack = 6;
  uint64 requester_broker_id = 7; // stamped onto the unacked-index entry
}

message FetchAmqpQueueMessageReply {
  bool has_message = 1;
  bytes record = 2;
  uint64 offset = 3;
  optional uint64 index_offset = 4;
}

enum BrokerUpdateCacheResourceType {
  Session = 0;
  User = 1;
  Subscribe = 2;
  Topic = 3;
  Connector = 4;
  Schema = 5;
  SchemaResource = 6;
  ClusterResourceConfig = 7;
  Node = 8;
  Shard = 9;
  Segment = 10;
  SegmentMeta = 11;
  Acl = 12;
  Blacklist = 13;
  Tenant = 14;
  AutoSubscribeRule = 15;
  TopicRewriteRule = 16;
  NatsSubscribe = 17;
  Mq9Mail = 18;
  ShareGroup = 19;
  ShareGroupMember = 20;
  GroupOffset = 21;
  Mq9Agent = 22;
  KafkaQuota = 23;
  KafkaDelegationToken = 24;
  KafkaScram = 25;
  AmqpExchange = 26;
  AmqpQueue = 27;
  AmqpBinding = 28;
}

enum BrokerUpdateCacheActionType {
  Create = 0;
  Update = 1;
  Delete = 2;
}

message QueryReplicaLeoRequest {
  string shard_name = 1;
  uint32 segment_seq = 2;
}

message QueryReplicaLeoReply {
  uint64 segment_leo = 1;
  uint32 latest_leader_epoch = 2;
  uint64 log_start_offset = 3;
  bool available = 4;
}
