name: Pre-commit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .requirements-precommit.txt

      - name: Install pre-commit
        run: python -m pip install -r .requirements-precommit.txt

      - name: Run pre-commit checks (pull request)
        if: github.event_name == 'pull_request'
        run: >-
          SKIP=cargo-fmt-auto,hawkeye-fmt-auto
          pre-commit run
          --from-ref "${{ github.event.pull_request.base.sha }}"
          --to-ref "${{ github.event.pull_request.head.sha }}"
          --show-diff-on-failure

      - name: Run pre-commit checks (main push)
        if: github.event_name == 'push'
        run: >-
          SKIP=cargo-fmt-auto,hawkeye-fmt-auto
          pre-commit run
          --from-ref "${{ github.event.before }}"
          --to-ref "${{ github.sha }}"
          --show-diff-on-failure
