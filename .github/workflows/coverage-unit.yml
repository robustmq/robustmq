name: Unit Coverage

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/coverage-unit.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "makefile"
      - "scripts/coverage-unit.sh"
      - "src/**"
  workflow_dispatch:
    inputs:
      package:
        description: Optional workspace package list for a package-scoped coverage run (comma-separated)
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 16
  COVERAGE_PACKAGE: ${{ inputs.package || '' }}

jobs:
  unit-coverage:
    name: Unit Coverage (report-only)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout exact commit under test
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Initialize coverage artifact paths
        run: |
          echo "COVERAGE_OUTPUT_DIR=${RUNNER_TEMP}/robustmq-coverage-unit" >> "$GITHUB_ENV"
          echo "COVERAGE_ARTIFACT_DIR=${RUNNER_TEMP}/robustmq-coverage-artifacts" >> "$GITHUB_ENV"
          if [[ -n "${COVERAGE_PACKAGE:-}" ]]; then
            if [[ ! "$COVERAGE_PACKAGE" =~ ^[A-Za-z0-9_-]+(,[A-Za-z0-9_-]+)*$ ]]; then
              echo "Invalid package selector: ${COVERAGE_PACKAGE}" >&2
              exit 2
            fi
          fi
          mkdir -p "$RUNNER_TEMP/robustmq-coverage-artifacts/reports" \
            "$RUNNER_TEMP/robustmq-coverage-artifacts/html" \
            "$RUNNER_TEMP/robustmq-coverage-artifacts/diagnostics"
          printf '%s\n' "Coverage workflow initialized before setup steps." \
            > "$RUNNER_TEMP/robustmq-coverage-artifacts/reports/README.txt"
          printf '%s\n' "HTML coverage was not generated before the workflow stopped." \
            > "$RUNNER_TEMP/robustmq-coverage-artifacts/html/README.txt"
          printf '%s\n' "Coverage workflow initialized before setup steps." \
            > "$RUNNER_TEMP/robustmq-coverage-artifacts/diagnostics/workflow-started.txt"

      - name: Free disk space for instrumented build
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: llvm-tools-preview

      - name: Validate coverage package selector
        run: python3 -m unittest scripts/test_select_coverage_package.py

      - name: Select pull request coverage packages
        id: select-package
        if: github.event_name == 'pull_request' && !inputs.package
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only -z "${BASE_SHA}" "${HEAD_SHA}" > "$RUNNER_TEMP/coverage-changed-paths.bin"
          echo "Coverage package diff: ${BASE_SHA}..${HEAD_SHA}"
          python3 - "$RUNNER_TEMP/coverage-changed-paths.bin" <<'PY'
          import pathlib
          import sys

          paths = pathlib.Path(sys.argv[1]).read_bytes().split(b"\0")
          for path in paths:
              if path:
                  print(path.decode("utf-8"))
          PY
          package="$(python3 scripts/select-coverage-package.py < "$RUNNER_TEMP/coverage-changed-paths.bin")"
          case "$package" in
            workspace)
              echo "Changed paths are shared or ambiguous; using workspace scope."
              echo "package=" >> "$GITHUB_OUTPUT"
              echo "COVERAGE_PACKAGE=" >> "$GITHUB_ENV"
              ;;
            skip)
              echo "No unit-testable src/ package changed; skipping unit coverage."
              echo "package=" >> "$GITHUB_OUTPUT"
              echo "COVERAGE_PACKAGE=" >> "$GITHUB_ENV"
              echo "COVERAGE_SKIP_UNIT=true" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Automatically selected package scope: $package"
              echo "package=$package" >> "$GITHUB_OUTPUT"
              echo "COVERAGE_PACKAGE=$package" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Resolve coverage scope
        id: resolve-scope
        env:
          INPUT_PACKAGE: ${{ inputs.package || '' }}
        run: |
          package="${COVERAGE_PACKAGE:-}"
          if [[ -z "$package" ]]; then
            package="$INPUT_PACKAGE"
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"
          if [[ "$package" == *,* ]]; then
            IFS=',' read -r -a packages <<< "$package"
            flags=()
            for selected_package in "${packages[@]}"; do
              flags+=("unit-package-${selected_package}")
            done
            echo "flag=$(IFS=,; echo "${flags[*]}")" >> "$GITHUB_OUTPUT"
          elif [[ -n "$package" ]]; then
            echo "flag=unit-package-${package}" >> "$GITHUB_OUTPUT"
          else
            echo "flag=unit" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler \
            cmake \
            pkg-config \
            libssl-dev \
            libsasl2-dev \
            libcurl4-openssl-dev \
            libzstd-dev \
            libclang-dev
          protoc --version
          cmake --version

      - name: Install coverage tools
        uses: taiki-e/install-action@v2
        with:
          tool: |
            cargo-llvm-cov@0.6.21
            cargo-nextest@0.9.84

      - name: Cache HuggingFace model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-fastembed-xenova-all-minilm-l6-v2-v1-${{ runner.os }}
          restore-keys: |
            hf-fastembed-xenova-all-minilm-l6-v2-v1-

      - name: Pre-download fastembed embedding model
        run: |
          pip install -q huggingface_hub
          python3 - <<'EOF'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id="Xenova/all-MiniLM-L6-v2",
              allow_patterns=[
                  "onnx/model_quantized.onnx",
                  "tokenizer.json",
                  "config.json",
                  "special_tokens_map.json",
                  "tokenizer_config.json",
              ],
              cache_dir=os.path.expanduser("~/.cache/huggingface/hub"),
          )
          print("fastembed model ready")
          EOF

      - name: Prepare coverage metadata
        run: |
          mkdir -p "$COVERAGE_ARTIFACT_DIR/reports" \
            "$COVERAGE_ARTIFACT_DIR/html" \
            "$COVERAGE_ARTIFACT_DIR/diagnostics"

          {
            if [[ "${COVERAGE_SKIP_UNIT:-false}" == "true" ]]; then
              echo "Unit coverage skipped: no unit-testable package changed."
              echo
              echo "The changed paths are covered by integration workflows or do not affect Rust package code."
            elif [[ -n "${COVERAGE_PACKAGE:-}" ]]; then
              echo "make coverage-unit PACKAGE=${COVERAGE_PACKAGE}"
              echo
              echo "Package-scoped coverage selection: ${COVERAGE_PACKAGE}"
              echo "Cargo may still compile and instrument dependency crates."
            else
              echo "make coverage-unit"
              echo
              echo "Workspace scope excludes robustmq-test and grpc-clients,"
              echo "and filters the storage-adapter meta test."
            fi
            echo "Coverage is report-only; no percentage threshold is enforced."
          } > "$COVERAGE_ARTIFACT_DIR/reports/test-command.txt"

          {
            llvm_cov="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-cov"
            echo "workflow: ${GITHUB_WORKFLOW}"
            echo "event: ${GITHUB_EVENT_NAME}"
            echo "ref: ${GITHUB_REF}"
            echo "workflow sha: ${GITHUB_SHA}"
            echo "checked out sha: $(git rev-parse HEAD)"
            echo "rustc: $(rustc --version)"
            echo "cargo: $(cargo --version)"
            echo "llvm-cov: $($llvm_cov --version | head -n 1)"
            echo "cargo llvm-cov: $(cargo llvm-cov --version)"
            echo "cargo nextest: $(cargo nextest --version)"
            echo "runner image: ubuntu-22.04"
          } > "$COVERAGE_ARTIFACT_DIR/reports/toolchain.txt"

      - name: Run local unit coverage runner
        id: coverage
        continue-on-error: true
        if: env.COVERAGE_SKIP_UNIT != 'true'
        run: |
          if [[ -n "${COVERAGE_PACKAGE:-}" ]]; then
            make coverage-unit PACKAGE="${COVERAGE_PACKAGE}"
          else
            make coverage-unit
          fi

      - name: Upload unit coverage to Codecov
        id: codecov
        if: steps.coverage.outcome == 'success'
        uses: codecov/codecov-action@v5
        with:
          files: ${{ runner.temp }}/robustmq-coverage-unit/lcov.info
          flags: ${{ steps.resolve-scope.outputs.flag }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Stage coverage reports and diagnostics
        if: always()
        run: |
          set +e
          reports="$COVERAGE_ARTIFACT_DIR/reports"
          diagnostics="$COVERAGE_ARTIFACT_DIR/diagnostics"
          html="$COVERAGE_ARTIFACT_DIR/html"

          if [ -d "$COVERAGE_OUTPUT_DIR" ]; then
            for report in coverage.txt lcov.info coverage.json coverage-summary.json summary.txt; do
              if [ -f "$COVERAGE_OUTPUT_DIR/$report" ]; then
                cp "$COVERAGE_OUTPUT_DIR/$report" "$reports/$report"
              fi
            done
            if [ -d "$COVERAGE_OUTPUT_DIR/html" ]; then
              cp -a "$COVERAGE_OUTPUT_DIR/html/." "$html/"
            fi
            if [ -f "$COVERAGE_OUTPUT_DIR/run.log" ]; then
              cp "$COVERAGE_OUTPUT_DIR/run.log" "$diagnostics/run.log"
            fi
          fi

          {
            echo "coverage runner outcome: ${{ steps.coverage.outcome }}"
            echo "coverage selection skipped: ${COVERAGE_SKIP_UNIT:-false}"
            echo "Codecov upload outcome: ${{ steps.codecov.outcome || 'not-run' }}"
            echo "coverage output directory: $COVERAGE_OUTPUT_DIR"
            echo "staged report files:"
            find "$reports" -maxdepth 1 -type f -printf '%f\n' | sort
            echo "staged HTML files:"
            find "$html" -type f -printf '%P\n' | sort | head -100
          } > "$diagnostics/workflow-context.txt"

          if [ -d "$COVERAGE_OUTPUT_DIR" ]; then
            find "$COVERAGE_OUTPUT_DIR" -maxdepth 1 -type f -printf '%f\n' | sort \
              > "$diagnostics/coverage-output-files.txt"
          else
            echo "Coverage output directory was not created." \
              > "$diagnostics/coverage-output-files.txt"
          fi

      - name: Publish report-only coverage summary
        if: always()
        run: |
          reports="$COVERAGE_ARTIFACT_DIR/reports"
          {
            echo "## Rust Unit Coverage (report-only)"
            echo
            echo "This workflow measures the existing unit-test scope only. It excludes \`robustmq-test\`, \`grpc-clients\`, and the \`storage-adapter\` meta test. It does not enforce a percentage threshold."
            echo
            echo "- Commit under test: \`$(git rev-parse HEAD)\`"
            echo "- Runner outcome: \`${{ steps.coverage.outcome }}\`"
            echo "- Codecov upload step: \`${{ steps.codecov.outcome || 'not-run' }}\`"
            if [ "${COVERAGE_SKIP_UNIT:-false}" = "true" ]; then
              echo "- Coverage selection: skipped (no unit-testable package changed)"
            elif [ -n "${COVERAGE_PACKAGE:-}" ]; then
              echo "- Coverage selection: package(s) \`${COVERAGE_PACKAGE}\`"
            else
              echo "- Coverage selection: full workspace"
            fi
            if [ -f "$reports/coverage-summary.json" ] && command -v jq >/dev/null 2>&1; then
              echo "- Test result: \`$(jq -r '.test_result | "\(.passed) passed, \(.failed) failed, \(.skipped) skipped"' "$reports/coverage-summary.json")\`"
              echo "- Profiles: \`$(jq -r '.profile_count' "$reports/coverage-summary.json")\`"
              echo "- Toolchain: \`$(jq -r '.toolchain.rustc' "$reports/coverage-summary.json")\`, \`$(jq -r '.toolchain.cargo_llvm_cov' "$reports/coverage-summary.json")\`, \`$(jq -r '.toolchain.cargo_nextest' "$reports/coverage-summary.json")\`"
            fi
            echo
            if [ -f "$reports/coverage.txt" ]; then
              echo "### Coverage values"
              echo
              echo '```text'
              if ! grep -E '^[[:space:]]*TOTAL[[:space:]]' "$reports/coverage.txt"; then
                echo "TOTAL line was not present in coverage.txt; see the downloadable report."
              fi
              echo '```'
            else
              echo "Coverage reports were not generated. Download \`coverage-unit-diagnostics\` for the failure log."
            fi
            echo
            echo "### Downloadable artifacts"
            echo
            echo "- \`coverage-unit-reports\`: text, LCOV, JSON, metadata, toolchain, and test command"
            echo "- \`coverage-unit-html\`: interactive HTML report"
            echo "- \`coverage-unit-diagnostics\`: runner log and workflow diagnostics"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-reports
          path: ${{ runner.temp }}/robustmq-coverage-artifacts/reports
          if-no-files-found: warn

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-html
          path: ${{ runner.temp }}/robustmq-coverage-artifacts/html
          if-no-files-found: warn

      - name: Upload coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-diagnostics
          path: ${{ runner.temp }}/robustmq-coverage-artifacts/diagnostics
          if-no-files-found: warn

      - name: Fail when coverage runner failed
        if: always() && env.COVERAGE_SKIP_UNIT != 'true' && steps.coverage.outcome != 'success'
        run: |
          echo "The unit coverage runner did not complete successfully."
          exit 1
