name: Manual Format Maintenance

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch to format
        required: true
        default: main
        type: string
      target_branch:
        description: Branch that should receive the formatting pull request
        required: true
        default: main
        type: string
      format_scope:
        description: Use rust-only formatting or all safe text formatters
        required: true
        default: rust
        type: choice
        options:
          - rust
          - all
      dry_run:
        description: Show the proposed diff without creating a branch or pull request
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: manual-format-maintenance-${{ inputs.source_branch }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_branch }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt

      - name: Set up Python
        if: inputs.format_scope == 'all'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .requirements-precommit.txt

      - name: Install pre-commit
        if: inputs.format_scope == 'all'
        run: python -m pip install -r .requirements-precommit.txt

      - name: Apply Rust formatting
        run: cargo fmt --all

      - name: Apply safe text formatting
        if: inputs.format_scope == 'all'
        env:
          SKIP: cargo-fmt-auto,hawkeye-fmt-auto
        run: |
          mapfile -t format_files < <(
            git ls-files -- . ':(exclude).github/**'
          )
          if [ "${#format_files[@]}" -eq 0 ]; then
            echo "No safe formatting files were found."
            exit 0
          fi

          set +e
          for hook in end-of-file-fixer trailing-whitespace mixed-line-ending black; do
            pre-commit run "$hook" --files "${format_files[@]}"
            status=$?
            if [ "$status" -gt 1 ]; then
              exit "$status"
            fi
          done

      - name: Show proposed changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes are needed."
          else
            git diff --stat
            git diff --check
          fi

      - name: Create formatting pull request
        if: inputs.dry_run == false && inputs.target_branch != ''
        id: create-pr
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/manual-format-maintenance
          base: ${{ inputs.target_branch }}
          delete-branch: true
          title: "chore: apply manual formatting maintenance"
          commit-message: "chore: apply manual formatting maintenance"
          body: |
            This pull request was generated by the manual format-maintenance workflow.

            - Source branch: `${{ inputs.source_branch }}`
            - Formatting scope: `${{ inputs.format_scope }}`

            The workflow applies formatting only and does not change application logic.

      - name: Report formatting result
        if: always()
        env:
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run completed; no pull request was requested."
          elif [ -n "$PR_URL" ]; then
            echo "Formatting pull request: $PR_URL"
          else
            echo "No formatting changes were needed; no pull request was created."
          fi
