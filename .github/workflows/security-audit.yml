name: Security Audit

on:
  push:
    branches: [ "main", "dev-*" ]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  schedule:
    # Run security audit daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

# Cancel previous runs if a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit (vulnerabilities only)
        # Fail on vulnerabilities with a compatible upgrade. These advisories
        # remain transitive and require upstream major-version migrations:
        # - mongodb 2.x pins rustls 0.21 and webpki-roots 0.25;
        # - async-nats 0.38 pins rustls-webpki 0.102;
        # - jsonwebtoken 10 pins crypto-bigint 0.5;
        # - Lance/Arrow pins zstd 0.13.
        # Revisit these ignores when the upstream packages provide compatible
        # releases. Directly controlled dependencies are upgraded in Cargo.lock.
        run: >-
          cargo audit
          --ignore RUSTSEC-2026-0346
          --ignore RUSTSEC-2026-0349
          --ignore RUSTSEC-2026-0381
          --ignore RUSTSEC-2026-0382
          --ignore RUSTSEC-2026-0387
          --ignore RUSTSEC-2026-0391
          --ignore RUSTSEC-2026-0398
          --ignore RUSTSEC-2026-0403

      - name: Check for unmaintained dependencies (warning only)
        # Report unmaintained dependencies but don't fail
        run: cargo audit --deny unmaintained
        continue-on-error: true

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo deny (licenses, bans, sources)
        # These checks are offline and don't require advisory database
        # licenses: ensure all deps use approved licenses
        # bans: detect duplicate crate versions
        # sources: verify crates come from allowed registries/repos
        run: cargo deny check licenses bans sources

  dependency-review:
    name: Dependency Review
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          # Fail the build on critical vulnerabilities
          fail-on-severity: critical
          # License checking is handled by cargo-deny above, which understands
          # Rust's multi-license expressions.
